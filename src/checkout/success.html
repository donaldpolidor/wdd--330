<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Successful - SleepOutside</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/success.js" type="module"></script>
</head>
<body>
    <header class="divider" id="main-header">
        <!-- Header loaded dynamically -->
    </header>

    <main class="divider">
        <div class="success-container">
            <h1>Order Successful! 🎉</h1>
            <div class="success-message">
                <p>Thank you for your purchase!</p>
                <p>Your order has been processed successfully.</p>
                
                <!-- Ajouter les détails de la commande -->
                <div id="order-details" class="order-details">
                    <p><strong>Order Number:</strong> <span id="order-id">Loading...</span></p>
                    <p><strong>Order Date:</strong> <span id="order-date">Loading...</span></p>
                    <p><strong>Total Amount:</strong> <span id="order-total">Loading...</span></p>
                </div>
                
                <p>You will receive a confirmation email shortly.</p>
            </div>
            <div class="success-buttons">
                <a href="../index.html" class="btn-primary">Return to Home</a>
                <a href="../product_listing/index.html?category=tents" class="btn-secondary">Continue Shopping</a>
            </div>
        </div>
    </main>

    <footer id="main-footer">
        <!-- Footer loaded dynamically -->
    </footer>
</body>
</html>
